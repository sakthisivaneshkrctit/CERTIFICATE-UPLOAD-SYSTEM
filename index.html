<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Certificate System - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Certificate Upload System</h1>

    <label for="role">Login as</label>
    <select id="role">
      <option value="student">Student</option>
      <option value="faculty">Faculty</option>
      <option value="admin">Admin</option>
    </select>

    <input id="email" type="email" placeholder="Enter email (e.g. stud1@gmail.com)" />

    <button id="loginBtn">Login</button>

    <p class="muted">Sample accounts: <br>
      Students: stud1@gmail.com ... stud10@gmail.com<br>
      Faculties: fac.a@gmail.com (Section A), fac.b@gmail.com (Section B)<br>
      Admin: admin@gmail.com
    </p>
  </div>

  <script src="script.js"></script>
  <script>
    document.getElementById('loginBtn').addEventListener('click', login);
  </script>
</body>
</html>
